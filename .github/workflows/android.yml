name: Build Android app

# The app loads the live web app, so web changes need no new APK.
# A new APK is only built when the native Android part changes (or on demand).
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx vite build
      - run: npx cap sync android
      - name: Build signed APK
        working-directory: android
        env:
          RIDEGRID_BUILD: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../RideGrid-India.apk
      - name: Publish to the "android-latest" release (fixed download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: RideGrid India – Android app
          body: |
            Latest Android app (build ${{ github.run_number }}).
            Download **RideGrid-India.apk** below and open it on your phone to install / update.
            Web updates reach the app automatically; this file only changes when the native part changes.
          files: RideGrid-India.apk
          make_latest: true
