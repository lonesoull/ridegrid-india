name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # re-deploy when fresh India data has been published
  workflow_run:
    workflows: ['Build India data', 'Build routing graphs', 'Build offline search', 'Build offline maps']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch India data (expressways, states) from the "india-data" release
        run: |
          mkdir -p public/data
          for f in expressways.json india-states.json summary.json; do
            curl -fsSL -o public/data/$f https://github.com/${{ github.repository }}/releases/download/india-data/$f || echo "no $f yet"
          done
          ls -la public/data
      - name: Fetch on-device routing graphs from the "india-graph" release
        run: |
          mkdir -p public/graphs
          # both detail levels for every zone (compact format keeps the whole site well under GitHub Pages' 1 GB)
          for b in southern-zone western-zone northern-zone central-zone eastern-zone north-eastern-zone; do for z in $b-main $b; do
            curl -fsSL -o public/graphs/$z.rgg.gz https://github.com/${{ github.repository }}/releases/download/india-graph/$z.rgg.gz || rm -f public/graphs/$z.rgg.gz
            curl -fsSL -o public/graphs/$z.json https://github.com/${{ github.repository }}/releases/download/india-graph/$z.json || rm -f public/graphs/$z.json
          done; done
          du -sh public/graphs
          # Daily mode: offline search + road alerts
          mkdir -p public/poi
          for z in southern-zone western-zone northern-zone central-zone eastern-zone north-eastern-zone; do for f in $z.poi.tsv $z.alerts.tsv $z.poi.json; do
            curl -fsSL -o public/poi/$f https://github.com/${{ github.repository }}/releases/download/india-poi/$f || rm -f public/poi/$f
          done; done
          du -sh public/poi
          ls -la public/graphs
      - run: npm test
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
